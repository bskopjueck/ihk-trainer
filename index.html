<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0f14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IHK-Trainer">
<meta name="application-name" content="IHK-Trainer">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Privater Lerntrainer. Inhalte verschlüsselt.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<title>IHK-Prüfungstrainer – Immobilienkaufmann/-frau</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --panel2:#f1f3f6; --panel3:#e8ebf0;
  --line:#e3e7ec; --line2:#cbd3dd;
  --txt:#101419; --txt2:#39424e; --muted:#6a7581;
  --acc:#2f5cdb; --acc2:#2449b8; --acc-soft:#e9eefc; --acc-line:#bfd0f7;
  --ok:#0e7a48; --ok-soft:#e1f4ea; --ok-line:#a8dcc2;
  --warn:#8a5600; --warn-soft:#fdf2df; --warn-line:#eccf9a;
  --bad:#b02620; --bad-soft:#fdecea; --bad-line:#f0b8b4;
  --gold:#8a6508;
  --sh1:0 1px 2px rgba(16,20,26,.06);
  --sh2:0 6px 20px -6px rgba(16,20,26,.16);
  --sh3:0 18px 50px -14px rgba(16,20,26,.28);
  --r:14px; --rs:10px; --rl:20px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --navh:60px;
}
html[data-theme="dark"]{
  --bg:#0c0f14; --panel:#151a22; --panel2:#1c222c; --panel3:#252d39;
  --line:#272f3b; --line2:#3a4553;
  --txt:#eef1f6; --txt2:#c3ccd8; --muted:#8e9aa8;
  --acc:#6591ff; --acc2:#8fb0ff; --acc-soft:#16233f; --acc-line:#2b447a;
  --ok:#41c184; --ok-soft:#0d2a1d; --ok-line:#1d5238;
  --warn:#e0aa42; --warn-soft:#2a2113; --warn-line:#59461f;
  --bad:#f0736c; --bad-soft:#2c1719; --bad-line:#5c2b2b;
  --gold:#dcb14a;
  --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 6px 20px -6px rgba(0,0,0,.65);
  --sh3:0 18px 50px -14px rgba(0,0,0,.8);
}
@media (prefers-color-scheme:dark){ html:not([data-theme="light"]){
  --bg:#0c0f14; --panel:#151a22; --panel2:#1c222c; --panel3:#252d39;
  --line:#272f3b; --line2:#3a4553;
  --txt:#eef1f6; --txt2:#c3ccd8; --muted:#8e9aa8;
  --acc:#6591ff; --acc2:#8fb0ff; --acc-soft:#16233f; --acc-line:#2b447a;
  --ok:#41c184; --ok-soft:#0d2a1d; --ok-line:#1d5238;
  --warn:#e0aa42; --warn-soft:#2a2113; --warn-line:#59461f;
  --bad:#f0736c; --bad-soft:#2c1719; --bad-line:#5c2b2b;
  --gold:#dcb14a;
  --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 6px 20px -6px rgba(0,0,0,.65);
  --sh3:0 18px 50px -14px rgba(0,0,0,.8);
}}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.6;
 -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.ic{flex:none;vertical-align:-.16em}
.wrap{max-width:940px;margin:0 auto;padding:0 20px 120px}
@media(min-width:861px){ .wrap{padding-bottom:70px} }

/* ---------- Kopf ---------- */
header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--panel) 90%,transparent);
 backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.hd{max-width:940px;margin:0 auto;padding:0 20px;height:var(--navh);display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;cursor:pointer;
 white-space:nowrap;letter-spacing:-.012em;background:none;border:none;color:inherit;font-family:inherit;padding:0}
.brand .lg{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;
 background:linear-gradient(145deg,var(--acc),#6d3fd4);box-shadow:var(--sh1)}
.brand em{font-style:normal;color:var(--muted);font-weight:500;font-size:12px}
nav.top{display:flex;gap:2px;margin-left:auto}
nav.top button{background:none;border:none;color:var(--muted);padding:8px 14px;border-radius:9px;font:inherit;
 font-size:14px;font-weight:550;cursor:pointer;transition:.14s}
nav.top button:hover{background:var(--panel2);color:var(--txt)}
nav.top button[aria-current="page"]{background:var(--acc-soft);color:var(--acc);font-weight:650}
.hdr-right{display:flex;gap:7px;align-items:center;margin-left:auto}
nav.top+.hdr-right{margin-left:10px}
.ico{background:none;border:1px solid var(--line);color:var(--muted);width:34px;height:34px;border-radius:9px;
 cursor:pointer;flex:none;display:grid;place-items:center;transition:.14s}
.ico:hover{border-color:var(--line2);color:var(--txt);background:var(--panel2)}
.hstat{display:flex;align-items:center;gap:9px;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px}
.pill.xp{color:var(--acc);background:var(--acc-soft)}
.pill.fire{color:#c2500f;background:#fff1e6}
html[data-theme="dark"] .pill.fire{color:#f0955a;background:#2c1d11}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .pill.fire{color:#f0955a;background:#2c1d11}}

/* ---------- Mobile Tabbar ---------- */
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
 background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(14px);
 border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tab button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;
 display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;cursor:pointer}
nav.tab button[aria-current="page"]{color:var(--acc)}
@media(max-width:860px){ nav.top{display:none} nav.tab{display:flex} .brand em{display:none} }

/* ---------- Typo ---------- */
h1{font-size:26px;margin:26px 0 8px;letter-spacing:-.03em;line-height:1.22;font-weight:730}
h2{font-size:16px;margin:32px 0 12px;letter-spacing:-.01em;font-weight:680;display:flex;align-items:center;gap:9px;
 text-transform:uppercase;font-size:12.5px;letter-spacing:.07em;color:var(--muted)}
h3{font-size:15.5px;margin:20px 0 7px;font-weight:660}
.lede{color:var(--muted);margin:0 0 20px;max-width:64ch;font-size:15px}
.muted{color:var(--muted)} .small{font-size:13.5px} .mono{font-family:var(--mono)} .hide{display:none!important}
.nums{font-variant-numeric:tabular-nums}

/* ---------- Bausteine ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh1)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(122px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border:none;
 border-radius:11px;padding:11px 18px;font:inherit;font-weight:650;font-size:14.5px;cursor:pointer;
 transition:transform .12s,background .14s,box-shadow .14s;box-shadow:var(--sh1);text-align:center}
.btn:hover{background:var(--acc2);box-shadow:var(--sh2)}
.btn:active{transform:scale(.982)}
.btn.lg{padding:15px 24px;font-size:16px;border-radius:13px;width:100%}
.btn.sec{background:var(--panel);color:var(--txt);border:1px solid var(--line2)}
.btn.sec:hover{background:var(--panel2)}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{color:var(--txt);background:var(--panel2)}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.bar{height:7px;background:var(--panel3);border-radius:99px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar.ok i{background:var(--ok)} .bar.w i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar.sm{height:5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;border-radius:99px;
 background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;font-weight:600}
.tag.acc{background:var(--acc-soft);color:var(--acc);border-color:var(--acc-line)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.tag.warn{background:var(--warn-soft);color:var(--gold);border-color:var(--warn-line)}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.kpi{font-size:30px;font-weight:740;letter-spacing:-.035em;line-height:1.05}
.kpi small{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-top:5px;letter-spacing:.02em;
 text-transform:uppercase}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:22px 0 6px;flex-wrap:wrap}
.crumb button{background:none;border:none;color:var(--acc);font:inherit;font-size:13px;cursor:pointer;padding:0;
 display:inline-flex;align-items:center;gap:3px;font-weight:600}
.crumb button:hover{text-decoration:underline}
footer{margin-top:54px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}

/* ---------- Dashboard ---------- */
.hero{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);
 border-radius:var(--rl);padding:22px;margin-bottom:16px;box-shadow:var(--sh1)}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;background:
 radial-gradient(620px 200px at 6% -40%,color-mix(in srgb,var(--acc) 15%,transparent),transparent 72%),
 radial-gradient(420px 180px at 98% 130%,color-mix(in srgb,#6d3fd4 12%,transparent),transparent 72%)}
.hero>*{position:relative}
.greet{font-size:13px;color:var(--muted);font-weight:600}
.cdrow{display:flex;align-items:flex-end;gap:14px;margin-top:4px;flex-wrap:wrap}
.cdbig{font-size:42px;font-weight:780;letter-spacing:-.045em;line-height:1}
.cdsub{font-size:13.5px;color:var(--muted);padding-bottom:5px}
.reifebar{margin-top:16px}
.reifehead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:7px}
.reifehead b{font-size:19px;font-weight:730;letter-spacing:-.02em}
.mission{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;
 box-shadow:var(--sh2);margin-bottom:18px}
.mhead{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.mhead .mt{font-size:19px;font-weight:720;letter-spacing:-.025em}
.mhead .ms{font-size:13px;color:var(--muted);margin-top:2px}
.mlist{padding:6px}
.mrow{display:flex;gap:13px;align-items:center;padding:11px 14px;border-radius:12px;width:100%;
 background:none;border:none;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:.13s}
.mrow:hover{background:var(--panel2)}
.mrow[disabled]{cursor:default}
.mi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
 background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.mrow.done .mi{background:var(--ok);color:#fff;border-color:transparent}
.mrow.now .mi{background:var(--acc);color:#fff;border-color:transparent}
.mrow.now{background:var(--acc-soft)}
.mb{flex:1;min-width:0}
.mb b{display:block;font-size:14.5px;font-weight:640;letter-spacing:-.01em}
.mrow.done .mb b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.mb span{display:block;font-size:12.5px;color:var(--muted)}
.mmin{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.mfoot{padding:14px 18px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.statrow div{background:var(--panel);padding:13px 10px;text-align:center}
.statrow b{display:block;font-size:19px;font-weight:720;letter-spacing:-.02em}
.statrow span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;font-weight:600}
@media(max-width:560px){ .statrow{grid-template-columns:repeat(2,1fr)} .cdbig{font-size:34px} }

/* ---------- Listen / Kacheln ---------- */
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;
 text-align:left;font:inherit;color:inherit;width:100%;display:block;transition:.15s;box-shadow:var(--sh1)}
.tile:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh2)}
.thead{display:flex;gap:11px;align-items:flex-start;margin-bottom:8px}
.ttile{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
 background:hsl(var(--h) 70% 96%);color:hsl(var(--h) 55% 34%);border:1px solid hsl(var(--h) 46% 89%)}
html[data-theme="dark"] .ttile{background:hsl(var(--h) 40% 15%);color:hsl(var(--h) 66% 70%);border-color:hsl(var(--h) 30% 26%)}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .ttile{
 background:hsl(var(--h) 40% 15%);color:hsl(var(--h) 66% 70%);border-color:hsl(var(--h) 30% 26%)}}
.tname{font-weight:650;font-size:15px;letter-spacing:-.012em;line-height:1.3;padding-top:2px}
.tsub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.tfoot{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--muted)}
.lrow{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);
 border-radius:12px;padding:13px 15px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
 transition:.14s;box-shadow:var(--sh1);margin-bottom:9px}
.lrow:hover{border-color:var(--acc)}
.lrow .li{flex:none;width:34px;height:34px;border-radius:10px;background:var(--panel2);color:var(--muted);
 display:grid;place-items:center;border:1px solid var(--line);font-weight:700;font-size:13px}
.lrow.done .li{background:var(--ok);color:#fff;border-color:transparent}
.lrow .lb{flex:1;min-width:0}
.lrow .lb b{display:block;font-size:14.5px;font-weight:620}
.lrow .lb span{display:block;font-size:12.5px;color:var(--muted)}
.lrow .la{color:var(--muted);flex:none}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);
 padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--txt);box-shadow:var(--sh1)}

/* ---------- Lernkarte / Übungen ---------- */
.stage{max-width:660px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.qtop .qprog{flex:1}
.qkind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:24px;box-shadow:var(--sh2)}
@media(max-width:560px){ .qbox{padding:18px 16px;border-radius:16px} }
.qctx{font-size:13px;color:var(--muted);background:var(--panel2);border-radius:var(--rs);padding:10px 13px;margin-bottom:14px}
.qtx{font-size:18.5px;font-weight:660;margin:0 0 18px;line-height:1.45;letter-spacing:-.018em}
.qtx p{margin:0 0 9px} .qtx p:last-child{margin:0}
.opt{display:flex;gap:13px;align-items:flex-start;background:var(--panel);border:1.5px solid var(--line);
 border-radius:12px;padding:14px 16px;margin-bottom:9px;cursor:pointer;font-size:15.5px;transition:.13s;
 width:100%;text-align:left;font-family:inherit;color:inherit;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--acc-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:grid;
 place-items:center;font-size:12.5px;font-weight:700;color:var(--muted);transition:.13s}
.opt:hover:not(:disabled) .k{border-color:var(--acc);color:var(--acc)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);animation:pop .3s}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .34s}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.022)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-5px)}55%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tf button{padding:20px 12px;font-size:17px;font-weight:700;border-radius:14px;border:1.5px solid var(--line);
 background:var(--panel);color:var(--txt);cursor:pointer;font-family:inherit;transition:.13s;
 display:flex;flex-direction:column;align-items:center;gap:6px}
.tf button:hover:not(:disabled){border-color:var(--acc);background:var(--acc-soft)}
.tf button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);animation:pop .3s}
.tf button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .34s}
.tf button:disabled{cursor:default;opacity:.75}
.tf button.right:disabled,.tf button.wrong:disabled{opacity:1}
/* Zuordnen */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){ .match{grid-template-columns:1fr} }
.mcol{display:flex;flex-direction:column;gap:8px}
.mchip{border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:12px 13px;font:inherit;
 font-size:14.5px;text-align:left;cursor:pointer;color:inherit;transition:.13s;position:relative;line-height:1.4}
.mchip:hover:not(:disabled){border-color:var(--acc)}
.mchip.sel{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 3px var(--acc-soft)}
.mchip.paired{border-color:var(--ok-line);background:var(--ok-soft);cursor:default}
.mchip.miss{border-color:var(--bad);background:var(--bad-soft)}
.mchip .pn{position:absolute;top:6px;right:8px;font-size:10px;font-weight:800;color:var(--ok)}
.mchip:disabled{cursor:default}
/* Reihenfolge */
.sortl{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.sorti{display:flex;gap:11px;align-items:center;border:1.5px solid var(--line);background:var(--panel);
 border-radius:11px;padding:11px 12px;font-size:14.5px;line-height:1.4}
.sorti .sn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acc-soft);color:var(--acc);
 display:grid;place-items:center;font-weight:800;font-size:12.5px}
.sorti .st{flex:1;min-width:0}
.sorti .sb{display:flex;flex-direction:column;gap:2px;flex:none}
.sorti .sb button{width:26px;height:20px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;
 cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.sorti .sb button:hover{border-color:var(--acc);color:var(--acc)}
.sorti .sb button:disabled{opacity:.3;cursor:default}
.sorti.right{border-color:var(--ok);background:var(--ok-soft)}
.sorti.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* Eingaben */
input[type=text],input[type=number],input[type=date],textarea,select{background:var(--panel2);color:var(--txt);
 border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font:inherit;font-size:16px;width:100%}
textarea{min-height:130px;resize:vertical;line-height:1.6}

/* ---------- Handy: Überläufe verhindern ---------- */
@media (max-width:560px){
  html,body{max-width:100%;overflow-x:hidden}
  .hd{padding:0 14px;gap:9px}
  .brand{font-size:13px;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden}

  .brand>span:not(.lg){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .hdr-right{gap:5px;flex:none;margin-left:6px}
  .ico{width:32px;height:32px}
  .hstat{gap:5px}
  .pill{font-size:11px;padding:3px 7px;gap:3px}
  /* lange Etiketten dürfen umbrechen statt die Seite zu sprengen */
  .tag{white-space:normal;overflow-wrap:anywhere;max-width:100%;text-align:left}
  /* breite Tabellen bekommen ihren eigenen Schiebebereich */
  table.stat,table.calc{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.stat{font-size:13px}
  table.stat th,table.stat td{padding:9px 7px;white-space:nowrap}
  table.stat th:first-child,table.stat td:first-child{white-space:normal;min-width:140px}
  pre,code{overflow-x:auto;max-width:100%}
  h1{font-size:23px}
  .kpi{font-size:26px}
  img,svg,video{max-width:100%}
}
  /* Zahl und Einheit gehören zusammen */
  .kpi,.reifehead b,.pill,.mmin{white-space:nowrap}
  .reifehead{gap:12px}
  .reifehead>span:first-child{min-width:0}
  /* Missionszeile: Minutenangabe unter den Text statt daneben */
  .mrow{align-items:flex-start;padding:12px 13px;gap:11px;flex-wrap:wrap}
  .mb b{font-size:14px}
  .mi{order:1;margin-top:1px}
  .mb{order:2;flex:1 1 0;min-width:0}
  .mmin{order:3;flex:1 1 100%;text-align:right;margin-top:2px}
}

}

(function(){
"use strict";
var KEYC='ihk_code', KEYK='ihk_kennung';
var el=function(id){ return document.getElementById(id); };

/* Eine vierstellige PIN allein wäre zu kurz. Der zweite Teil des Schlüssels

   danach genügt die PIN. */
function kennung(){
  var m=(location.hash||'').match(/[#&]k=([A-Za-z0-9_-]{8,})/)
     || (location.search||'').match(/[?&]k=([A-Za-z0-9_-]{8,})/);

function merken(k){

function setMsg(t,bad){ var m=el('lgmsg'); if(!m) return;
  m.textContent=t||''; m.className=t?(bad?'lgerr':'lgnote'):''; }

async function derive(code,salt){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code+':'+kennung()),'PBKDF2',false,['deriveKey']);
